<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bible Study Guides</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="landing-body">

  <div class="landing-header">
    <button type="button" class="share-btn" id="share-btn"><span aria-hidden="true">&#9638;</span> <span id="share-btn-label">Share</span></button>
    <div class="lang-switcher" id="lang-switcher"></div>
    <h1 id="landing-title">Bible Study Guides</h1>
  </div>

  <div class="landing-search-wrap">
    <div class="landing-search">
      <span class="ls-icon" aria-hidden="true">&#128269;</span>
      <input type="search" id="landing-search-input" autocomplete="off" aria-label="Search studies" />
      <button class="ls-clear hidden" id="landing-search-clear" title="Clear" aria-label="Clear search"><span aria-hidden="true">&times;</span></button>
    </div>
  </div>

  <div class="sr-only" id="landing-status" role="status" aria-live="polite" aria-atomic="true"></div>

  <main class="landing-list" id="landing-list">
    <div class="landing-empty" id="landing-loading">Loading studies&hellip;</div>
  </main>

  <script src="js/i18n.js?v=6"></script>
  <script src="js/qrcode.js?v=1"></script>
  <script src="js/share.js?v=1"></script>
  <script>
    (async function () {
      await I18N.init();

      document.getElementById('share-btn-label').textContent = I18N.t('share');
      Share.mount(document.getElementById('share-btn'), () => {
        const url = new URL(location.href);
        url.search = '';
        url.hash = '';
        const lang = I18N.get();
        if (lang && lang !== 'en') url.searchParams.set('lang', lang);
        return url.toString();
      });

      document.title = I18N.t('landingTitle');
      document.getElementById('landing-title').textContent = I18N.t('landingTitle');
      document.getElementById('landing-loading').textContent = I18N.t('landingLoading');
      I18N.buildSwitcher(document.getElementById('lang-switcher'));

      const searchInput = document.getElementById('landing-search-input');
      const searchClear = document.getElementById('landing-search-clear');
      searchInput.placeholder = I18N.t('searchPlaceholder');
      searchInput.setAttribute('aria-label', I18N.t('searchStudies'));
      searchClear.title = I18N.t('clearSearch');
      searchClear.setAttribute('aria-label', I18N.t('clearSearch'));
      const status = document.getElementById('landing-status');

      const list = document.getElementById('landing-list');
      let sortedWeeks = [];

      const plain = s => String(s || '').replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').replace(/"/g, '&quot;').trim();

      function cardHTML(w) {
        const videoLabel = `${I18N.t('watchSermon')}: ${plain(w.title || w.id)} (${I18N.t('opensNewTab')})`;
        const videoLink = w.videoUrl
          ? `<a class="lc-video-link" href="${w.videoUrl}" target="_blank" rel="noopener" aria-label="${videoLabel}"><span aria-hidden="true">&#9658;</span> ${I18N.t('watchSermon')}</a>`
          : '';
        return `
          <div class="landing-card">
            <a class="lc-main-link" href="study.html?week=${encodeURIComponent(w.id)}">
              <div class="lc-date">${w.series ? w.series + ' &middot; ' : ''}${w.date || ''}</div>
              <div class="lc-title">${w.title || w.id}</div>
              ${w.subtitle ? `<div class="lc-subtitle">${w.subtitle}</div>` : ''}
            </a>
            ${videoLink}
          </div>
        `;
      }

      function searchableText(w) {
        return [w.series, w.date, w.title, w.subtitle].filter(Boolean).join(' ').toLowerCase();
      }

      function renderList(query) {
        const q = (query || '').trim().toLowerCase();
        searchClear.classList.toggle('hidden', !q);
        const filtered = q
          ? sortedWeeks.filter(w => searchableText(w).includes(q))
          : sortedWeeks;
        if (!filtered.length) {
          list.innerHTML = `<div class="landing-empty">${I18N.t('searchNoResults')}</div>`;
          status.textContent = I18N.t('searchNoResults');
          return;
        }
        list.innerHTML = filtered.map(cardHTML).join('');
        status.textContent = q ? I18N.t('searchResultsCount').replace('{n}', filtered.length) : '';
      }

      searchInput.addEventListener('input', () => renderList(searchInput.value));
      searchClear.addEventListener('click', () => {
        searchInput.value = '';
        searchInput.focus();
        renderList('');
      });

      // manifest.json only lists which weeks exist and their (language-
      // independent) video links. All translatable display fields (date,
      // series, title, subtitle) live solely in each week's own
      // data/<id>/<id>.json / data/<id>/<id>.<lang>.json, so there's exactly
      // one place to update per language instead of also editing the manifest.
      fetch('data/manifest.json', { cache: 'no-cache' })
        .then(res => {
          if (!res.ok) throw new Error('manifest not found');
          return res.json();
        })
        .then(async manifest => {
          const entries = manifest.weeks || [];
          if (!entries.length) {
            list.innerHTML = `<div class="landing-empty">${I18N.t('landingEmpty')}</div>`;
            return;
          }
          const weeks = await Promise.all(entries.map(async entry => {
            const { data } = await I18N.loadWeekJSON(entry.id);
            const meta = data.meta || {};
            return {
              id: entry.id,
              videoUrl: entry.videoUrl,
              date: meta.date,
              series: meta.series,
              title: (meta.title || '').replace(/:\s*$/, ''),
              subtitle: meta.titleHighlight,
            };
          }));
          const parseDate = (w) => {
            const parsed = w.date ? new Date(`${w.date}, 2000`) : null;
            if (parsed && !isNaN(parsed)) return parsed;
            const [month, day] = (w.id || '').split('_').map(Number);
            return new Date(2000, (month || 1) - 1, day || 1);
          };
          sortedWeeks = weeks.slice().sort((a, b) => parseDate(b) - parseDate(a));
          renderList(searchInput.value);
        })
        .catch(err => {
          document.title = `${I18N.t('errorTitle')} | ${I18N.t('landingTitle')}`;
          const msg = document.createElement('div');
          msg.className = 'landing-empty';
          msg.setAttribute('role', 'alert');
          msg.textContent = `${I18N.t('landingError')} (${err.message}).`;
          const retry = document.createElement('button');
          retry.type = 'button';
          retry.className = 'nav-btn primary';
          retry.textContent = I18N.t('tryAgain');
          retry.addEventListener('click', () => location.reload());
          msg.append(document.createElement('br'), retry);
          list.replaceChildren(msg);
        });
    })();
  </script>
</body>
</html>
