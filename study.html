<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bible Study</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<a class="skip-link" id="skip-link" href="#q-stage">Skip to content</a>

<!-- ════════════════════════════════════════
     TOP CHROME
════════════════════════════════════════ -->
<header class="top-chrome">
  <a class="home-btn" id="home-btn" href="index.html" title="Back to home"><span class="arrow" aria-hidden="true">&#8592;</span> <span id="home-btn-label">Home</span></a>

  <div class="chrome-title">
    <div class="eyebrow" id="chrome-eyebrow"></div>
    <h1 id="chrome-title"></h1>
  </div>

  <a class="video-link hidden" id="chrome-video-link" href="#" target="_blank" rel="noopener">
    <span class="video-link-icon" aria-hidden="true">&#9658;</span> <span id="chrome-video-link-label"></span><span class="sr-only" id="chrome-video-link-hint"></span>
  </a>

  <nav class="section-pills" id="section-pills" aria-label="Study sections">
    <!-- injected by JS (includes the All Questions toggle as the last pill) -->
  </nav>

  <div class="font-controls" id="font-controls" role="group" aria-label="Font size">
    <span aria-hidden="true">Aa</span>
    <button class="font-btn" id="font-btn-smaller" onclick="adjustFont(-1)" title="Smaller">&#8722;</button>
    <button class="font-btn" id="font-btn-larger" onclick="adjustFont(1)"  title="Larger">&#43;</button>
  </div>

  <div class="lang-switcher" id="lang-switcher"></div>

  <button class="theme-toggle-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle light / dark mode">
    <span class="theme-icon" id="theme-icon" aria-hidden="true">&#9790;</span>
    <span id="theme-label">Dark</span>
  </button>
</header>

<!-- ════════════════════════════════════════
     MAIN WORKSPACE (two-column)
════════════════════════════════════════ -->
<main class="main-workspace" id="main-workspace">
<div class="workspace">

  <!-- LEFT PANEL -->
  <aside class="left-panel" id="left-panel" aria-label="Passages and voices for this question">
    <div class="left-panel-header" id="left-header">
      <div class="part-badge" id="left-part-badge"></div>
      <div class="part-name" id="left-part-name"></div>
    </div>
    <div class="left-panel-body" id="left-body">
      <!-- injected by JS -->
    </div>
  </aside>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="q-counter-bar">
      <div class="q-dots" id="q-dots" role="group" aria-label="Questions"></div>
      <div class="q-of-total" id="q-of-total" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>

    <div class="q-stage" id="q-stage" tabindex="-1">
      <div class="app-loading" id="app-loading" role="status">Loading study&hellip;</div>
    </div>

    <div class="q-nav-bar">
      <button class="nav-btn" id="btn-prev" onclick="prevQ()" disabled>
        <span class="arrow" aria-hidden="true">&#8592;</span> <span id="btn-prev-label">Prev</span>
      </button>
      <button class="nav-btn primary" id="btn-next" onclick="nextQ()">
        <span id="btn-next-label">Next</span> <span class="arrow" aria-hidden="true">&#8594;</span>
      </button>
    </div>
  </div>

</div>
</main><!-- /main-workspace -->

<!-- ════════════════════════════════════════
     PRINT-ONLY OVERVIEW (auto-built from data)
════════════════════════════════════════ -->
<div class="overview-section" id="overview-section">
  <!-- injected by JS -->
</div>

<div class="page-footer">
  <span id="page-footer-text"></span>
</div>

<script src="js/i18n.js?v=5"></script>
<script src="js/app.js?v=6"></script>
</body>
</html>
